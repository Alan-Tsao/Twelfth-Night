<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>第十二夜｜公關介紹</title>
    <link rel="icon" href="images/favicon-32.png" type="image/png">
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/cast-today-status-color-patch.css">
    <link rel="stylesheet" href="css/motion-effects.css">
    <link rel="stylesheet" href="css/personal-menu-scroll-fix.css">
</head>

<body>
    <nav class="site-nav">
        <div class="nav-inner"><a class="brand" href="index.html">第十二夜</a>
            <div class="nav-links"><a href="index.html">首頁</a><a href="service.html">服務項目</a><a
                    href="cast.html">公關介紹</a> <a href="menu.html">菜單</a></div><!-- <a href="booking.html">線上預約</a></div> -->
        </div>
    </nav>
    <header class="page-hero">
        <div class="page-hero-panel">
            <div class="eyebrow">CAST PROFILE</div>
            <h1>公關介紹</h1>
            <p class="hero-text">每一位公關都有不同的陪伴方式。此頁顯示長期指名狀態與排班摘要；實際可預約名單會在預約頁依照你選擇的日期自動判斷。</p>
        </div>
    </header>
    <section class="toolbar cast-filter-toolbar">
        <div class="filter-panel">
            <div class="filter-group filter-group-status" aria-label="狀態篩選">
                <div class="filter-group-title">狀態篩選</div>
                <div class="filters">
                    <button class="filter-btn active status-filter" data-filter="all" type="button">全部</button>
                    <button class="filter-btn status-filter" data-filter="available" type="button">可指名</button>
                    <button class="filter-btn status-filter" data-filter="today" type="button">今日出勤</button>
                    <button class="filter-btn status-filter" data-filter="pending" type="button">詢問制</button>
                </div>
            </div>

            <div class="filter-group filter-group-service" aria-label="服務特色">
                <div class="filter-group-title">服務特色</div>
                <div class="filters">
                    <button class="filter-btn" data-filter="champagne" type="button">香檳 CALL</button>
                    <button class="filter-btn" data-filter="bar" type="button">調酒</button>
                    <button class="filter-btn" data-filter="masaji" type="button">按摩</button>
                    <button class="filter-btn special-filter" data-filter="personal" type="button">個人服務</button>
                </div>
            </div>
        </div>

        <div class="search-box"><input id="castSearch" type="search" placeholder="搜尋公關名字或特色，例如：俏皮、陪酒、塔羅" /></div>
    </section>
    <main>
        <section class="cast-grid" id="castGrid"></section>
        <div class="empty" id="emptyState">沒有找到符合條件的公關。可以換個關鍵字或選擇「全部」。</div>
        <div class="footer-note">※「接受指名」代表此公關平常可被預約；「今日出勤」只代表今天是否有排班。實際可預約名單請以預約頁選擇日期後顯示為準。</div>
    </main>
    <footer class="footer">
        <div class="logo">第十二夜</div>
        <div>© 2026 Twelfth Night. Built by Hana.</div>
    </footer>
    <script src="js/cast-data.js"></script>
    <script src="js/cast-page.js"></script>
    <!-- <script src="js/scroll-reveal.js"></script> -->
</body>

</html>
