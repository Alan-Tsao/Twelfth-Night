<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firebase Firestore 測試｜第十二夜</title>
  <style>
    :root{--bg:#08070d;--card:rgba(255,255,255,.075);--border:rgba(255,255,255,.14);--text:#f7edf8;--muted:#cbbfd0;--gold:#e8c981;--pink:#f2a7c6;--danger:#ff9aa9;--ok:#b7efc5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:"Noto Serif TC","Microsoft JhengHei","PingFang TC",serif;color:var(--text);background:radial-gradient(circle at top left,rgba(242,167,198,.26),transparent 34%),radial-gradient(circle at 80% 12%,rgba(155,135,245,.22),transparent 34%),linear-gradient(180deg,#08070d,#11101a 48%,#08070d);line-height:1.8;padding:28px}
    main{width:min(960px,100%);margin:0 auto}
    .hero,.panel{border:1px solid var(--border);background:var(--card);border-radius:30px;box-shadow:0 22px 70px rgba(0,0,0,.38);backdrop-filter:blur(18px)}
    .hero{padding:clamp(26px,5vw,54px);margin-bottom:22px}
    .eyebrow{color:var(--gold);letter-spacing:.22em;font-size:13px;margin-bottom:12px}
    h1{margin:0 0 12px;font-size:clamp(34px,5vw,58px);letter-spacing:.08em;line-height:1.15}
    p{color:var(--muted);margin:0}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .panel{padding:24px}
    label{display:grid;gap:8px;color:var(--gold);font-size:14px;letter-spacing:.06em}
    input,textarea{width:100%;min-height:46px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:var(--text);border-radius:18px;padding:11px 14px;font:inherit;outline:none}
    textarea{min-height:280px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;white-space:pre}
    input:focus,textarea:focus{border-color:rgba(232,201,129,.45);box-shadow:0 0 0 3px rgba(232,201,129,.10)}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
    button{appearance:none;min-height:44px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:var(--text);border-radius:999px;padding:9px 18px;font:inherit;cursor:pointer}
    button.primary{background:linear-gradient(135deg,rgba(232,201,129,.96),rgba(242,167,198,.92));color:#22131b;font-weight:700}
    button:hover{border-color:rgba(232,201,129,.45);filter:brightness(1.08)}
    .status{margin-top:14px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);color:var(--muted);white-space:pre-wrap}
    .status.ok{color:var(--ok);border-color:rgba(183,239,197,.26);background:rgba(183,239,197,.08)}
    .status.err{color:var(--danger);border-color:rgba(255,154,169,.26);background:rgba(255,154,169,.08)}
    .hint{font-size:13px;color:var(--muted);margin-top:8px}
    @media(max-width:780px){body{padding:16px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div class="eyebrow">FIREBASE TEST</div>
      <h1>Firestore 連線測試</h1>
      <p>這頁用來確認 Live Server / GitHub Pages 是否能讀寫 <strong>rooms / TESTROOM</strong>。</p>
    </section>

    <section class="grid">
      <div class="panel">
        <label>房間 ID<input id="roomId" value="TESTROOM" /></label>
        <label style="margin-top:14px">主持人名稱<input id="hostName" value="測試主持" /></label>

        <div class="actions">
          <button class="primary" id="connectBtn">連線監聽</button>
          <button id="writeBtn">寫入 / 更新房間</button>
          <button id="playingBtn">改成 playing</button>
          <button id="waitingBtn">改成 waiting</button>
          <button id="addRoundBtn">回合 +1</button>
        </div>

        <div class="status" id="statusBox">尚未連線。</div>
        <div class="hint">成功後，請回 Firebase Console 看 <strong>rooms / TESTROOM</strong> 是否即時更新。</div>
      </div>

      <div class="panel">
        <label>即時讀取資料<textarea id="output" readonly>尚未讀取</textarea></label>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import {
      getFirestore,
      doc,
      setDoc,
      updateDoc,
      onSnapshot,
      serverTimestamp,
      increment
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA6v46nstI5pEqEiVJ7_8DgQiIz65AS5-E",
      authDomain: "fir-firestore-a6023.firebaseapp.com",
      projectId: "fir-firestore-a6023",
      storageBucket: "fir-firestore-a6023.firebasestorage.app",
      messagingSenderId: "167421866892",
      appId: "1:167421866892:web:735c461a9c9cbfe1175ca9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const $ = (id) => document.getElementById(id);

    let unsubscribe = null;
    let currentRoomRef = null;

    function getRoomId() {
      return $("roomId").value.trim() || "TESTROOM";
    }

    function getRoomRef() {
      return doc(db, "rooms", getRoomId());
    }

    function setStatus(message, type = "") {
      const box = $("statusBox");
      box.textContent = message;
      box.className = "status" + (type ? " " + type : "");
    }

    function connectRoom() {
      if (unsubscribe) unsubscribe();

      currentRoomRef = getRoomRef();

      unsubscribe = onSnapshot(
        currentRoomRef,
        (snapshot) => {
          if (!snapshot.exists()) {
            $("output").value = "目前沒有這個房間文件。請按「寫入 / 更新房間」。";
            setStatus("已連線，但房間還不存在。", "");
            return;
          }

          $("output").value = JSON.stringify(snapshot.data(), null, 2);
          setStatus("已成功即時讀取 Firestore。", "ok");
        },
        (error) => {
          console.error(error);
          setStatus("讀取失敗：" + error.message, "err");
        }
      );
    }

    async function ensureRoom() {
      currentRoomRef = getRoomRef();

      await setDoc(currentRoomRef, {
        game: "dragonGate",
        status: "waiting",
        hostName: $("hostName").value.trim() || "測試主持",
        round: 0,
        updatedAt: serverTimestamp()
      }, { merge: true });

      setStatus("已寫入 / 更新房間。", "ok");

      if (!unsubscribe) connectRoom();
    }

    async function updateStatus(status) {
      currentRoomRef = getRoomRef();

      await updateDoc(currentRoomRef, {
        status,
        updatedAt: serverTimestamp()
      });

      setStatus("已將狀態改成：" + status, "ok");
    }

    async function addRound() {
      currentRoomRef = getRoomRef();

      await updateDoc(currentRoomRef, {
        round: increment(1),
        updatedAt: serverTimestamp()
      });

      setStatus("已讓回合 +1。", "ok");
    }

    $("connectBtn").addEventListener("click", connectRoom);
    $("writeBtn").addEventListener("click", ensureRoom);
    $("playingBtn").addEventListener("click", () => updateStatus("playing"));
    $("waitingBtn").addEventListener("click", () => updateStatus("waiting"));
    $("addRoundBtn").addEventListener("click", addRound);

    connectRoom();
  </script>
</body>
</html>
